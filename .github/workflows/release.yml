name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-14-dev clang-14 libllvm14

      - name: Build VastNova
        run: bash build.sh

      - name: Package
        run: |
          mkdir -p dist/vastnova
          cp vastnova dist/vastnova/
          cp -r std dist/vastnova/
          cp -r examples dist/vastnova/ 2>/dev/null || true
          tar -czvf vastnova-linux-x64.tar.gz -C dist .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: vastnova-linux-x64.tar.gz
          generate_release_notes: true

